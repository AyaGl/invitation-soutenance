<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Invitation Soutenance</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body{
      margin:0;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#f8f1f1;
      font-family: 'Poppins', sans-serif;
    }

    /* Hauteur augmentée à 420px pour accueillir tout ton texte confortablement */
    .envelope{
      position:relative;
      width:480px; 
      height:420px;
      background:#ffffff;
      border-radius:15px;
      box-shadow:0 15px 35px rgba(0,0,0,0.15);
      overflow:hidden;
    }

    /* Ajustement du volet de l'enveloppe */
    .flap{
      position:absolute;
      top:0;
      left:0;
      width:0;
      height:0;
      border-left:240px solid transparent; 
      border-right:240px solid transparent; 
      border-top:180px solid #ff8fa3;
      transform-origin:top;
      animation:open 2s ease forwards;
      z-index:3;
    }

    /* Ajustement de la lettre pour la nouvelle hauteur */
    .letter{
      position:absolute;
      width:420px;
      height:380px;
      background:white;
      left:30px;
      top:40px;
      border-radius:10px;
      text-align:center;
      padding:20px;
      box-sizing:border-box;
      animation:showLetter 2s ease forwards;
      z-index:1;
    }

    h2{
      color: #ff8fa3;
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 10px;
      margin-top: 5px;
    }

    p{
      color:#444;
      font-size:16px;
      line-height: 1.5;
      margin:10px 0;
    }

    .finally{
      color: #ff8fa3;
      font-weight:bold;
      font-size:22px;
      margin-top: 15px;
    }

    .heart{
      font-size:34px;
      animation:beat 1s infinite;
      margin-bottom: 5px;
    }

    @keyframes open{
      from{
        transform:rotateX(0deg);
      }
      to{
        transform:rotateX(180deg);
      }
    }

    @keyframes showLetter{
      from{
        transform:translateY(120px);
        opacity:0;
      }
      to{
        transform:translateY(-25px);
        opacity:1;
      }
    }

    @keyframes beat{
      0%,100%{
        transform:scale(1);
      }
      50%{
        transform:scale(1.2);
      }
    }
  </style>
</head>

<body>

  <div class="envelope">
    <div class="flap"></div>
    <div class="letter">
      <div class="heart">💌</div>
      <h2>Dear My Family & Friends</h2>
      <p>I am so happy to announce that I am finally graduated! 🎓</p>
      <p>You are invited to my graduation babieesss ✨</p>
      <p><strong>Save the date:</strong> 📅 11.06.2026</p>
      <p class="finally">FINALLY I am soo happy! 🥳🎉</p>
    </div>
  </div>

</body>
</html>
